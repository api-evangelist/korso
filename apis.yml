aid: korso
name: Korso
description: 'Korso is a Los Angeles based company (Y Combinator Spring 2026) building tooling for
  the next generation of software. Its flagship open source product, Shepherd, is a coordination layer
  for AI coding agents: a Fastify + Postgres hub, a published stdio Model Context Protocol server
  (@korso/shepherd on npm), a shared zod wire contract, and a React dashboard (@korso/shepherd-ui).
  Shepherd lets a fleet of agents working across sessions, worktrees, and team members claim files,
  release claims, broadcast announcements, and refresh a shared workspace landscape so they stop
  producing merge conflicts and overwriting each other. The MCP surface exposes seven documented tools
  (work, done, announce, sync, link, unlink, decline). Korso also runs a beta Trading API over its own
  quantitative trading desk and Korso Research, an AI-native research workspace.'
